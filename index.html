<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACB Bank Dashboard</title>
  <style>
    :root {
      --bg: #f7f5ef;
      --paper: #ffffff;
      --ink: #20242b;
      --muted: #667085;
      --line: #dadde2;
      --teal: #127c72;
      --teal-soft: #e7f3f1;
      --rose: #b3485d;
      --blue: #2d5f9f;
      --amber: #c87d1d;
      --green: #4f8f47;
      --shadow: 0 16px 40px rgba(32, 36, 43, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    select {
      font: inherit;
      letter-spacing: 0;
    }

    .app {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      border-right: 1px solid var(--line);
      background: #fcfbf8;
      padding: 22px 16px;
    }

    .brand {
      margin-bottom: 22px;
    }

    .brand h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.1;
    }

    .brand p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .overview-field {
      width: 100%;
    }

    .sidebar .overview-field span {
      font-size: 16px;
      font-weight: 800;
      color: var(--ink);
    }

    .tab-list {
      display: grid;
      gap: 6px;
    }

    .sheet-tab {
      width: 100%;
      max-width: 100%;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      padding: 10px 12px;
      text-align: left;
      font-size: 13px;
      white-space: normal;
      overflow-wrap: break-word;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    .sheet-tab:hover {
      background: #f0ede4;
    }

    .sheet-tab.active {
      background: var(--teal-soft);
      border-color: #b9dcd7;
      color: #0f6159;
      font-weight: 700;
    }

    .content {
      min-width: 0;
      padding: 28px;
    }

    .sheet-panel {
      display: none;
      max-width: 1380px;
      margin: 0 auto;
    }

    .sheet-panel.active {
      display: block;
    }

    .sheet-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--teal);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .sheet-title {
      margin: 0;
      font-size: 34px;
      line-height: 1.05;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      max-width: 560px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      padding: 8px 10px;
      min-width: 118px;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .stat strong {
      display: block;
      margin-top: 3px;
      font-size: 14px;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 12px;
      margin-bottom: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
      padding: 14px;
    }

    .field {
      display: grid;
      gap: 5px;
      min-width: 160px;
    }

    .field span,
    .check span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    select,
    input[type="search"] {
      height: 38px;
      min-width: 0;
      border: 1px solid #cfd4dc;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 0 10px;
      outline: none;
    }

    select:focus,
    input[type="search"]:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(18, 124, 114, 0.14);
    }

    .check {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 38px;
      padding: 0 8px;
    }

    .check input {
      width: 18px;
      height: 18px;
      accent-color: var(--teal);
    }

    .chart-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 16px;
      align-items: stretch;
    }

    .chart-panel,
    .table-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .chart-panel {
      padding: 16px;
    }

    .chart-panel h2,
    .table-panel h2 {
      margin: 0 0 12px;
      font-size: 17px;
    }

    .appendix-tier-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      align-items: start;
    }

    .appendix-tier-chart {
      display: grid;
      gap: 10px;
    }

    .appendix-tier-chart .eyebrow {
      margin: -6px 0 2px;
    }

    .appendix-bar-row {
      display: grid;
      grid-template-columns: minmax(44px, 54px) minmax(0, 1fr) minmax(86px, auto);
      gap: 10px;
      align-items: center;
      min-height: 28px;
      font-size: 12px;
    }

    .appendix-bar-label {
      font-weight: 800;
      color: var(--ink);
      overflow-wrap: anywhere;
    }

    .appendix-bar-track {
      height: 14px;
      border-radius: 999px;
      background: #eef1f4;
      overflow: hidden;
      border: 1px solid #d9dde4;
    }

    .appendix-bar-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--teal), var(--blue));
    }

    .appendix-bar-value {
      color: #4d5766;
      font-weight: 800;
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .appendix-rationale-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      align-items: stretch;
    }

    .appendix-rationale-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
      padding: 14px;
      min-height: 116px;
    }

    .appendix-rationale-card h2 {
      margin: 0 0 8px;
      color: var(--teal);
      font-size: 15px;
      line-height: 1.25;
    }

    .appendix-rationale-card p {
      margin: 0;
      color: #363c46;
      font-size: 13px;
      line-height: 1.5;
    }

    .disclaimer-intro {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
      padding: 16px 18px;
      margin-bottom: 16px;
    }

    .disclaimer-intro h2 {
      margin: 0 0 8px;
      color: var(--teal);
      font-size: 18px;
    }

    .disclaimer-intro p,
    .disclaimer-source p {
      margin: 0;
      color: #363c46;
      line-height: 1.55;
    }

    .disclaimer-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .disclaimer-card {
      border: 1px solid var(--line);
      border-top: 4px solid var(--teal);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
      padding: 16px 18px;
      min-height: 150px;
    }

    .disclaimer-card h2 {
      margin: 0 0 8px;
      color: var(--ink);
      font-size: 16px;
      line-height: 1.3;
    }

    .disclaimer-card p {
      margin: 0;
      color: #363c46;
      font-size: 13px;
      line-height: 1.55;
    }

    .disclaimer-source {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfaf7;
      padding: 14px 16px;
      margin-top: 16px;
    }

    .appendix-tab-sections {
      display: grid;
      gap: 18px;
    }

    .appendix-section > h2 {
      margin: 0 0 12px;
      color: var(--teal);
      font-size: 18px;
      line-height: 1.3;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #4d5766;
      font-size: 12px;
      font-weight: 700;
    }

    .legend-swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      border: 1px solid rgba(32, 36, 43, 0.12);
    }

    .chart-scroll {
      overflow-x: auto;
      padding-bottom: 4px;
    }

    svg {
      display: block;
      width: 100%;
      min-width: 680px;
      height: auto;
    }

    .axis {
      fill: #697386;
      font-size: 12px;
    }

    .axis-strong {
      fill: #20242b;
      font-size: 13px;
      font-weight: 800;
    }

    .grid-line {
      stroke: #e6e8ec;
      stroke-width: 1;
    }

    .zero-line {
      stroke: #9aa3af;
      stroke-width: 1.4;
    }

    .bar-label {
      fill: #20242b;
      font-size: 12px;
      font-weight: 700;
    }

    svg rect[data-tip] {
      cursor: pointer;
    }

    svg rect[data-tip]:hover {
      opacity: 0.82;
    }

    .chart-tooltip {
      position: fixed;
      z-index: 50;
      max-width: 260px;
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(32, 36, 43, 0.94);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.4;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -100%);
      transition: opacity 100ms ease;
      white-space: nowrap;
    }

    .chart-tooltip.visible {
      opacity: 1;
    }

    .market-grid {
      display: grid;
      gap: 12px;
    }

    .market-grid-single {
      grid-template-columns: minmax(0, 1fr);
    }

    .market-grid-2x2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .market-grid-3x1 {
      grid-template-columns: minmax(0, 1fr);
    }

    .market-chart {
      padding: 12px;
    }

    .market-chart h2 {
      margin-bottom: 6px;
      font-size: 15px;
    }

    .market-section {
      display: grid;
      gap: 12px;
      margin-bottom: 18px;
    }

    .market-section:last-child {
      margin-bottom: 0;
    }

    .market-section-title {
      margin: 0;
      color: var(--teal);
      font-size: 18px;
      line-height: 1.3;
    }

    .market-extra {
      margin-top: 18px;
    }

    .market-chart .chart-scroll {
      overflow: hidden;
    }

    .market-chart svg {
      min-width: 0;
    }

    .market-share-panel .sheet-header {
      margin-bottom: 10px;
    }

    .market-share-panel .toolbar {
      margin-bottom: 10px;
      padding: 10px;
    }

    .market-share-panel .legend {
      margin-bottom: 10px;
    }

    .market-share-panel .legend-item {
      font-size: 11px;
    }

    .empty {
      display: grid;
      place-items: center;
      min-height: 260px;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 8px;
    }

    .table-panel {
      margin-top: 16px;
      overflow: hidden;
    }

    .table-panel h2 {
      padding: 16px 16px 0;
    }

    .table-scroll {
      overflow: auto;
      max-height: 460px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
      font-size: 13px;
    }

    .appendix-table-compact {
      min-width: 0;
      table-layout: fixed;
      font-size: 13px;
    }

    .appendix-table-compact th,
    .appendix-table-compact td {
      white-space: normal;
      vertical-align: top;
      line-height: 1.45;
      text-align: left;
    }

    .appendix-table-compact th:first-child,
    .appendix-table-compact td:first-child {
      width: 28%;
      max-width: 260px;
      font-weight: 800;
      color: var(--ink);
    }

    .appendix-table-compact th:nth-child(2),
    .appendix-table-compact td:nth-child(2) {
      width: 72%;
    }

    th,
    td {
      border-top: 1px solid #edf0f3;
      padding: 9px 10px;
      text-align: right;
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #fbfaf7;
      color: #4d5766;
      font-size: 12px;
      text-transform: uppercase;
    }

    th:first-child,
    td:first-child,
    th:nth-child(2),
    td:nth-child(2) {
      text-align: left;
    }

    tbody tr:hover {
      background: #f8fbfa;
    }

    .group-pill {
      display: inline-flex;
      min-width: 42px;
      justify-content: center;
      border-radius: 999px;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 7px;
    }

    .eco-tick-table {
      table-layout: fixed;
      min-width: 0;
      width: 100%;
    }

    .eco-tick-table th,
    .eco-tick-table td {
      border: 1px solid #e6e8ec;
      white-space: normal;
      word-break: break-word;
    }

    .eco-tick-table th:first-child,
    .eco-tick-table td:first-child {
      width: 76px;
    }

    .eco-group-header {
      position: static;
      font-size: 11px;
      background: var(--teal-soft);
      color: var(--teal);
    }

    .eco-group-1 {
      background: #fbeedd;
      color: var(--amber);
    }

    .eco-cat-header {
      font-size: 10px;
      line-height: 1.25;
      padding: 6px 4px;
    }

    .eco-tick-table th.eco-group-header,
    .eco-tick-table th.eco-cat-header,
    .eco-tick-table td.eco-tick-cell {
      text-align: center;
    }

    .eco-tick-cell {
      color: var(--muted);
    }

    .eco-tick-yes {
      color: var(--green);
      font-weight: 800;
      font-size: 15px;
    }

    .eco-row-highlight,
    .eco-row-highlight:hover {
      background: #123a63;
    }

    .eco-row-highlight td {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .eco-row-highlight .eco-tick-cell {
      color: rgba(255, 255, 255, 0.55);
    }

    .eco-row-highlight .eco-tick-yes {
      color: #7ee787;
    }

    .positioning-note {
      color: var(--muted);
      font-size: 13px;
      margin-top: 0;
    }

    .positioning-note p {
      margin: 0 0 4px;
    }

    .positioning-note p:last-child {
      margin-bottom: 0;
    }

    .positioning-legend {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .relative-position-panel .positioning-legend {
      justify-content: flex-end;
    }

    .legend-bar {
      display: inline-block;
      width: 160px;
      height: 10px;
      border-radius: 5px;
      border: 1px solid rgba(32, 36, 43, 0.12);
    }

    .legend-edge {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .positioning-table th:first-child,
    .positioning-table td:first-child {
      width: 96px;
      text-align: left;
    }

    .group-tag {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
    }

    .positioning-table td {
      position: relative;
    }

    .box-badge {
      position: absolute;
      top: -7px;
      left: -7px;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--amber);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      line-height: 15px;
      text-align: center;
      z-index: 1;
    }

    .positioning-notes {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .positioning-note-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .positioning-note-item p {
      margin: 0;
      font-size: 13px;
      line-height: 1.55;
    }

    .zone-badge {
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--amber);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      line-height: 18px;
      text-align: center;
      margin-top: 2px;
    }

    .positioning-overall {
      margin: 4px 0 0;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      font-size: 13px;
      line-height: 1.55;
    }

    .swot-panel > h3 {
      margin: 20px 0 4px;
      font-size: 15px;
    }

    .swot-glance {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 8px;
    }

    .swot-glance-cell {
      border: 1px solid var(--line);
      border-top: 3px solid;
      border-radius: 8px;
      padding: 14px 16px;
    }

    .swot-glance-cell h4 {
      margin: 0 0 8px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .swot-glance-cell ul {
      margin: 0;
      padding-left: 18px;
      line-height: 1.55;
      font-size: 13px;
      color: var(--ink);
    }

    .swot-glance-cell li {
      margin-bottom: 4px;
    }

    .swot-glance-cell li:last-child {
      margin-bottom: 0;
    }

    .eco-score-chart svg {
      min-width: 0;
      max-width: 600px;
      margin: 0 auto;
    }

    .eco-score-panel .sheet-header {
      margin-bottom: 10px;
    }

    .eco-score-panel .toolbar {
      margin-bottom: 10px;
      padding: 10px 12px;
    }

    .eco-score-panel .chart-grid {
      gap: 10px;
    }

    .eco-score-panel .chart-panel {
      padding: 10px 14px 12px;
    }

    .eco-score-panel .chart-panel h2 {
      margin-bottom: 2px;
    }

    .eco-score-panel .eco-ticker-chip {
      padding: 4px 8px;
      font-size: 11px;
    }

    .eco-ticker-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .eco-ticker-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 10px;
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease, color 120ms ease, opacity 120ms ease;
    }

    .eco-ticker-chip:hover {
      border-color: #b9dcd7;
    }

    .eco-ticker-chip.active {
      background: var(--teal-soft);
      border-color: #b9dcd7;
      color: #0f6159;
    }

    .eco-ticker-chip:not(.active) {
      opacity: 0.55;
    }

    .spider-series circle {
      cursor: pointer;
    }

    .subsection {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--paper);
      box-shadow: var(--shadow);
      padding: 16px 18px;
      margin-bottom: 14px;
    }

    .subsection h3 {
      margin: 0 0 8px;
      font-size: 15px;
    }

    .subsection p {
      margin: 0 0 8px;
      line-height: 1.6;
      color: #363c46;
    }

    .subsection p:last-child {
      margin-bottom: 0;
    }

    .subsection ul {
      margin: 0 0 8px;
      padding-left: 20px;
      line-height: 1.6;
      color: #363c46;
    }

    .chart-figure {
      margin: 12px 0 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfaf7;
      padding: 12px 14px;
    }

    .chart-multi {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .chart-sub {
      flex: 1 1 320px;
      min-width: 0;
    }

    .chart-sub h4 {
      margin: 0 0 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .next-chapter-body p {
      margin: 0 0 12px;
      line-height: 1.6;
      color: #363c46;
    }

    .next-chapter-body ul {
      margin: 0 0 12px;
      padding-left: 20px;
      line-height: 1.6;
      color: #363c46;
    }

    .next-chapter-body > *:last-child {
      margin-bottom: 0;
    }

    .next-chapter-subheading {
      margin: 22px 0 10px;
      font-size: 15px;
      color: var(--teal);
    }

    .next-chapter-subheading:first-child {
      margin-top: 0;
    }

    .plan-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .plan-table th,
    .plan-table td {
      border: 1px solid var(--line);
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
    }

    .plan-table th {
      background: #fbfaf7;
      color: #4d5766;
      font-size: 12px;
      text-transform: uppercase;
    }

    .plan-table td:first-child {
      font-weight: 700;
      white-space: nowrap;
    }

    .plan-table ul {
      margin: 0;
      padding-left: 18px;
    }

    .plan-table li + li {
      margin-top: 6px;
    }

    .year-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .year-card {
      flex: 1 1 260px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--paper);
      box-shadow: var(--shadow);
      padding: 16px 18px;
    }

    .year-card h4 {
      margin: 0 0 4px;
      font-size: 16px;
      color: var(--teal);
    }

    .year-theme {
      margin: 0 0 10px;
      font-weight: 700;
      color: var(--ink);
    }

    .year-card ul {
      margin: 0;
      padding-left: 18px;
      color: #363c46;
      line-height: 1.5;
    }

    .year-card li + li {
      margin-top: 6px;
    }

    .info-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .info-cards-horizontal {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
    }

    .info-card {
      flex: 1 1 280px;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--paper);
      box-shadow: var(--shadow);
      padding: 16px 18px;
    }

    .info-card h4 {
      margin: 0 0 10px;
      font-size: 15px;
      line-height: 1.4;
      color: var(--ink);
    }

    .info-card-section + .info-card-section {
      margin-top: 12px;
    }

    .info-card-label {
      margin: 0 0 4px;
      font-size: 11px;
      font-weight: 800;
      color: var(--teal);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .info-card-section p {
      margin: 0;
      color: #363c46;
      line-height: 1.5;
    }

    .info-card-section ul {
      margin: 0;
      padding-left: 18px;
      color: #363c46;
      line-height: 1.5;
    }

    .info-card-section li + li {
      margin-top: 6px;
    }

    @media (max-width: 900px) {
      .app {
        display: block;
      }

      .info-cards-horizontal {
        display: flex;
        flex-wrap: wrap;
      }

      .swot-glance {
        grid-template-columns: minmax(0, 1fr);
      }

      .sidebar {
        position: relative;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .tab-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .sheet-tab {
        flex: 0 1 auto;
        width: auto;
        max-width: 100%;
      }

      .content {
        padding: 20px 14px;
      }

      .sheet-header {
        display: grid;
      }

      .stats {
        justify-content: flex-start;
      }

      .chart-grid {
        grid-template-columns: 1fr;
      }

      .market-grid {
        grid-template-columns: 1fr;
      }

      .appendix-tier-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .appendix-rationale-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .disclaimer-grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    const groupPalette = ["#d7ecff", "#9dccf1", "#6eaddf", "#3f86c2", "#235a95", "#10345f", "#082747"];
    const knownGroupColors = { SO: "#2f70ad", NCF: "#3f86c2", CF: "#235a95" };
    const numberFormat = new Intl.NumberFormat("en-US", { maximumFractionDigits: 2 });
    const compactFormat = new Intl.NumberFormat("en-US", { notation: "compact", maximumFractionDigits: 1 });
    const percentFormat = new Intl.NumberFormat("en-US", { style: "percent", maximumFractionDigits: 1 });

    function escapeHTML(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    const tooltipEl = document.getElementById("chartTooltip");

    function showTooltip(event, text) {
      tooltipEl.textContent = text;
      tooltipEl.classList.add("visible");
      moveTooltip(event);
    }

    function moveTooltip(event) {
      tooltipEl.style.left = `${event.clientX}px`;
      tooltipEl.style.top = `${event.clientY - 12}px`;
    }

    function hideTooltip() {
      tooltipEl.classList.remove("visible");
    }

    function wireTooltips(container) {
      container.querySelectorAll("[data-tip]").forEach((el) => {
        el.addEventListener("mouseenter", (event) => showTooltip(event, el.dataset.tip));
        el.addEventListener("mousemove", moveTooltip);
        el.addEventListener("mouseleave", hideTooltip);
      });
    }

    function groupColor(group) {
      const cleanGroup = String(group || "Other").trim() || "Other";
      if (knownGroupColors[cleanGroup]) {
        return knownGroupColors[cleanGroup];
      }
      let hash = 0;
      for (const letter of cleanGroup) {
        hash = (hash * 31 + letter.charCodeAt(0)) % 9973;
      }
      return groupPalette[hash % groupPalette.length];
    }

    function periodColor(index, period) {
      return periodColorByLabel[String(period)] || periodPalette[index % periodPalette.length];
    }

    const HIGHLIGHT_GROUP_A = new Set(["BID", "CTG", "VCB"]);
    const HIGHLIGHT_GROUP_B = new Set(["MBB", "VPB", "HDB", "SHB"]);

    function bankHighlightColor(ticker) {
      const clean = String(ticker || "").trim().toUpperCase();
      if (HIGHLIGHT_GROUP_A.has(clean)) {
        return "rgba(18, 124, 114, 0.12)";
      }
      if (HIGHLIGHT_GROUP_B.has(clean)) {
        return "rgba(179, 72, 93, 0.12)";
      }
      return null;
    }

    const BENCHMARK_DISABLED = new Set(["BondShare"]);
    const BENCHMARK_OVERRIDES = { LLCR: 1.00, NPL: 0.01, CAR: 0.08 };
    const BENCHMARK_LABELS = { LLCR: "100%", NPL: "1%", CAR: "8% (SBV min)" };

    const AVERAGE_BENCHMARK_SHEETS = new Set(["ROAE"]);

    function benchmarkLabel(sheet, value) {
      if (Object.prototype.hasOwnProperty.call(BENCHMARK_LABELS, sheet.name)) {
        return BENCHMARK_LABELS[sheet.name];
      }
      if (AVERAGE_BENCHMARK_SHEETS.has(sheet.name)) {
        return `ACB average: ${formatValue(value, sheet.format)}`;
      }
      return `ACB 2025: ${formatValue(value, sheet.format)}`;
    }

    function findAcbBenchmark(sheet) {
      if (BENCHMARK_DISABLED.has(sheet.name)) {
        return null;
      }
      if (Object.prototype.hasOwnProperty.call(BENCHMARK_OVERRIDES, sheet.name)) {
        return BENCHMARK_OVERRIDES[sheet.name];
      }
      const row = sheet.rows.find((r) => String(r.ticker).toUpperCase() === "ACB");
      if (!row) {
        return null;
      }
      const period = AVERAGE_BENCHMARK_SHEETS.has(sheet.name) ? "Average" : "2025";
      const value = asNumber(row.values[period]);
      return Number.isFinite(value) ? value : null;
    }

    function drawAcbBenchmark(parts, benchmarkY, plotLeft, plotRight, label) {
      parts.push(
        `<line x1="${plotLeft}" y1="${benchmarkY}" x2="${plotRight}" y2="${benchmarkY}" stroke="#2d5f9f" stroke-width="1.6" stroke-dasharray="1 4" stroke-linecap="round"></line>`
      );
      parts.push(`<circle cx="${plotRight}" cy="${benchmarkY}" r="3.5" fill="#2d5f9f"></circle>`);
      parts.push(
        `<text x="${plotRight}" y="${benchmarkY - 8}" text-anchor="end" fill="#2d5f9f" font-size="11" font-weight="800">${escapeHTML(label)}</text>`
      );
    }

    function formatValue(value, formatKind) {
      if (!Number.isFinite(value)) {
        return "";
      }
      if (formatKind === "percent") {
        return percentFormat.format(value);
      }
      if (Math.abs(value) >= 10000) {
        return compactFormat.format(value);
      }
      return numberFormat.format(value);
    }

    function asNumber(value) {
      if (value === null || value === undefined || value === "") {
        return NaN;
      }
      const number = Number(value);
      return Number.isFinite(number) ? number : NaN;
    }

    function getFilteredRows(sheet, index) {
      const selected = state[index];
      const filter = selected.filter.trim().toLowerCase();

      if (!filter) {
        return sheet.rows;
      }

      return sheet.rows.filter((row) =>
        row.ticker.toLowerCase().includes(filter) ||
        String(row.group).toLowerCase().includes(filter)
      );
    }

    function getValuePoints(sheet, index) {
      const rows = getFilteredRows(sheet, index);
      const points = [];

      rows.forEach((row) => {
        sheet.periods.forEach((period, periodIndex) => {
          const value = asNumber(row.values[period]);
          if (Number.isFinite(value)) {
            points.push({
              group: row.group || "Other",
              period,
              periodIndex,
              ticker: row.ticker,
              value
            });
          }
        });
      });

      return { rows, points };
    }

    function legendHTML(sheet) {
      return sheet.periods
        .map((period, index) => `
          <span class="legend-item">
            <span class="legend-swatch" style="background:${periodColor(index, period)}"></span>
            ${escapeHTML(period)}
          </span>
        `)
        .join("");
    }

    function combinedLegendHTML(tab) {
      const periods = [];
      const sheets = tab.sections ? tab.sections.flatMap((section) => section.sheets || []) : tab.sheets;
      sheets.forEach((sheet) => {
        sheet.periods.forEach((period) => {
          if (!periods.includes(period)) {
            periods.push(period);
          }
        });
      });

      return periods
        .map((period, index) => `
          <span class="legend-item">
            <span class="legend-swatch" style="background:${periodColor(index, period)}"></span>
            ${escapeHTML(period)}
          </span>
        `)
        .join("");
    }

    function renderLegend(panel, sheet) {
      panel.querySelector(".period-legend").innerHTML = legendHTML(sheet);
    }

    function drawGroupedBarChart(container, sheet, rows, points) {
      if (!rows.length || !points.length) {
        container.innerHTML = '<div class="empty">No data</div>';
        return;
      }

      const periodCount = Math.max(1, sheet.periods.length);
      const barWidth = periodCount > 16 ? 8 : periodCount > 11 ? 10 : 14;
      const barGap = periodCount > 16 ? 2 : 3;
      const groupPadding = 24;
      const groupWidth = Math.max(86, periodCount * barWidth + (periodCount - 1) * barGap + groupPadding);
      const width = Math.max(780, rows.length * groupWidth + 120);
      const height = 460;
      const margin = { top: 24, right: 24, bottom: 86, left: 76 };
      const plotHeight = height - margin.top - margin.bottom;
      const values = points.map((point) => point.value);
      const axis = sheet.axis;
      let minValue;
      let maxValue;
      const ticks = [];

      if (axis) {
        minValue = axis.min;
        maxValue = axis.max;
        const stepCount = Math.max(1, Math.round((maxValue - minValue) / axis.step));
        for (let i = 0; i <= stepCount; i += 1) {
          ticks.push(minValue + i * axis.step);
        }
      } else {
        minValue = Math.min(0, ...values);
        maxValue = Math.max(0, ...values);
        for (let i = 0; i <= 4; i += 1) {
          ticks.push(minValue + ((maxValue - minValue) * i) / 4);
        }
      }

      const span = maxValue - minValue || 1;
      const y = (value) => margin.top + ((maxValue - Math.min(Math.max(value, minValue), maxValue)) / span) * plotHeight;
      const zeroY = y(0);
      const parts = [];

      ticks.forEach((tick) => {
        const tickY = y(tick);
        parts.push(`<line class="grid-line" x1="${margin.left}" y1="${tickY}" x2="${width - margin.right}" y2="${tickY}"></line>`);
        parts.push(`<text class="axis" x="${margin.left - 10}" y="${tickY + 4}" text-anchor="end">${escapeHTML(formatValue(tick, sheet.format))}</text>`);
      });
      parts.push(`<line class="zero-line" x1="${margin.left}" y1="${zeroY}" x2="${width - margin.right}" y2="${zeroY}"></line>`);

      rows.forEach((row, rowIndex) => {
        const groupStart = margin.left + rowIndex * groupWidth + groupPadding / 2;
        const groupCenter = margin.left + rowIndex * groupWidth + groupWidth / 2;

        const highlightColor = bankHighlightColor(row.ticker);
        if (highlightColor) {
          parts.push(`<rect x="${margin.left + rowIndex * groupWidth}" y="${margin.top}" width="${groupWidth}" height="${plotHeight}" fill="${highlightColor}"></rect>`);
        }

        sheet.periods.forEach((period, periodIndex) => {
          const value = asNumber(row.values[period]);
          if (!Number.isFinite(value)) {
            return;
          }

          const barX = groupStart + periodIndex * (barWidth + barGap);
          const barY = Math.min(y(value), zeroY);
          const barHeight = Math.max(2, Math.abs(y(value) - zeroY));
          const label = formatValue(value, sheet.format);
          const tooltip = `${row.ticker} ${period}: ${label}${row.group ? " (" + row.group + ")" : ""}`;

          parts.push(`<rect data-tip="${escapeHTML(tooltip)}" x="${barX}" y="${barY}" width="${barWidth}" height="${barHeight}" rx="3" fill="${periodColor(periodIndex, period)}"></rect>`);
        });

        parts.push(`<text class="axis-strong" x="${groupCenter}" y="${height - margin.bottom + 30}" text-anchor="middle">${escapeHTML(row.ticker)}</text>`);
        parts.push(`<text class="axis" x="${groupCenter}" y="${height - margin.bottom + 48}" text-anchor="middle">${escapeHTML(row.group || "Other")}</text>`);
      });

      const benchmark = findAcbBenchmark(sheet);
      if (benchmark !== null) {
        drawAcbBenchmark(
          parts,
          y(benchmark),
          margin.left,
          width - margin.right,
          benchmarkLabel(sheet, benchmark)
        );
      }

      container.innerHTML = `<svg role="img" aria-label="${escapeHTML(sheet.name + " grouped bar chart")}" viewBox="0 0 ${width} ${height}">${parts.join("")}</svg>`;
      wireTooltips(container);
    }

    const NPL_MIX_MODES = [["quarter", "QoQ"], ["year", "YoY"]];
    const NPL_MIX_COLORS = {
      g2Bar: "#1b3a6b",
      nplBar: "#8fc1e8",
      g2Line: "#2d5f9f",
      nplLine: "#c87d1d"
    };

    function nplMixPanelHTML(sheet, sheetIndex) {
      return `
        <section class="chart-panel market-chart npl-mix-chart" data-market-chart="${sheetIndex}" data-npl-mix="true">
          <h2>${escapeHTML(sheet.title || sheet.name)}</h2>
          <section class="toolbar" aria-label="NPL Mix filters">
            <label class="field">
              <span>Period</span>
              <div class="eco-ticker-picker" data-npl-mix-period></div>
            </label>
            <label class="field" style="min-width: 60%;">
              <span>Bank</span>
              <div class="eco-ticker-picker" data-npl-mix-bank></div>
            </label>
          </section>
          <div class="legend">
            <span class="legend-item"><span class="legend-swatch" style="background:${NPL_MIX_COLORS.g2Bar}"></span>G2</span>
            <span class="legend-item"><span class="legend-swatch" style="background:${NPL_MIX_COLORS.nplBar}"></span>NPL (G3-G5)</span>
            <span class="legend-item"><span class="legend-swatch" style="background:${NPL_MIX_COLORS.g2Line}"></span>%G2</span>
            <span class="legend-item"><span class="legend-swatch" style="background:${NPL_MIX_COLORS.nplLine}"></span>%NPL</span>
          </div>
          <div class="chart-scroll market-chart-target"></div>
        </section>
      `;
    }

    function nplMixSeries(sheet, mode, bank) {
      const dataset = mode === "year" ? sheet.annual : sheet.quarterly;
      const periods = (dataset && dataset.periods) || [];
      const values = (dataset && dataset.values[bank]) || {};
      const g1 = values.G1 || [];
      const g2 = values.G2 || [];
      const g3 = values.G3 || [];
      const g4 = values.G4 || [];
      const g5 = values.G5 || [];

      return periods.map((period, i) => {
        const v1 = asNumber(g1[i]);
        const v2 = asNumber(g2[i]);
        const v3 = asNumber(g3[i]);
        const v4 = asNumber(g4[i]);
        const v5 = asNumber(g5[i]);
        const npl = v3 + v4 + v5;
        const total = v1 + v2 + v3 + v4 + v5;
        const hasTotal = Number.isFinite(total) && total > 0;

        return {
          period,
          g2: v2,
          npl,
          g2Pct: hasTotal && Number.isFinite(v2) ? v2 / total : NaN,
          nplPct: hasTotal && Number.isFinite(npl) ? npl / total : NaN
        };
      });
    }

    function drawNplMixChart(container, sheet, mode, bank) {
      const points = bank ? nplMixSeries(sheet, mode, bank) : [];
      const usable = points.filter((point) => Number.isFinite(point.g2) || Number.isFinite(point.npl));

      if (!usable.length) {
        container.innerHTML = '<div class="empty">No data</div>';
        return;
      }

      const periodCount = points.length;
      const groupSlot = periodCount > 16 ? 48 : periodCount > 10 ? 60 : 78;
      const width = Math.max(780, periodCount * groupSlot + 140);
      const height = 420;
      const margin = { top: 20, right: 64, bottom: 56, left: 64 };
      const plotWidth = width - margin.left - margin.right;
      const plotHeight = height - margin.top - margin.bottom;
      const slotWidth = plotWidth / periodCount;

      const barMax = Math.max(1, ...points.map((point) => Math.max(point.g2 || 0, point.npl || 0)));
      const barTicks = [0, 1, 2, 3, 4].map((i) => (barMax * i) / 4);

      const pctPeak = Math.max(
        0,
        ...points.map((point) => Math.max(point.g2Pct || 0, point.nplPct || 0))
      );
      const pctMax = Math.max(0.02, pctPeak * 1.15);
      const pctTicks = [0, 1, 2, 3, 4].map((i) => (pctMax * i) / 4);

      const barY = (value) => margin.top + (1 - Math.min(Math.max(value, 0), barMax) / barMax) * plotHeight;
      const pctY = (value) => margin.top + (1 - Math.min(Math.max(value, 0), pctMax) / pctMax) * plotHeight;
      const barGap = 4;
      const barWidth = Math.max(6, Math.min(22, (slotWidth - barGap * 3) / 2));

      const parts = [];

      barTicks.forEach((tick) => {
        const tickY = barY(tick);
        parts.push(`<line class="grid-line" x1="${margin.left}" y1="${tickY}" x2="${width - margin.right}" y2="${tickY}"></line>`);
        parts.push(`<text class="axis" x="${margin.left - 8}" y="${tickY + 4}" text-anchor="end">${escapeHTML(formatValue(tick, "number"))}</text>`);
      });
      pctTicks.forEach((tick) => {
        const tickY = pctY(tick);
        parts.push(`<text class="axis" x="${width - margin.right + 8}" y="${tickY + 4}" text-anchor="start">${escapeHTML(formatValue(tick, "percent"))}</text>`);
      });

      const g2LinePoints = [];
      const nplLinePoints = [];

      points.forEach((point, index) => {
        const groupStart = margin.left + index * slotWidth;
        const groupCenter = groupStart + slotWidth / 2;

        if (Number.isFinite(point.g2)) {
          const x = groupCenter - barGap / 2 - barWidth;
          const y = barY(point.g2);
          const h = Math.max(1, margin.top + plotHeight - y);
          const tooltip = `${bank} ${point.period} — G2: ${formatValue(point.g2, "number")}`;
          parts.push(`<rect data-tip="${escapeHTML(tooltip)}" x="${x}" y="${y}" width="${barWidth}" height="${h}" rx="2" fill="${NPL_MIX_COLORS.g2Bar}"></rect>`);
        }
        if (Number.isFinite(point.npl)) {
          const x = groupCenter + barGap / 2;
          const y = barY(point.npl);
          const h = Math.max(1, margin.top + plotHeight - y);
          const tooltip = `${bank} ${point.period} — NPL (G3-G5): ${formatValue(point.npl, "number")}`;
          parts.push(`<rect data-tip="${escapeHTML(tooltip)}" x="${x}" y="${y}" width="${barWidth}" height="${h}" rx="2" fill="${NPL_MIX_COLORS.nplBar}"></rect>`);
        }

        if (Number.isFinite(point.g2Pct)) {
          g2LinePoints.push([groupCenter, pctY(point.g2Pct), point]);
        }
        if (Number.isFinite(point.nplPct)) {
          nplLinePoints.push([groupCenter, pctY(point.nplPct), point]);
        }

        parts.push(`<text class="axis" x="${groupCenter}" y="${height - margin.bottom + 20}" text-anchor="middle">${escapeHTML(point.period)}</text>`);
      });

      const linePath = (pts) => pts.map(([x, y], i) => `${i === 0 ? "M" : "L"}${x},${y}`).join(" ");

      if (g2LinePoints.length > 1) {
        parts.push(`<path d="${linePath(g2LinePoints)}" fill="none" stroke="${NPL_MIX_COLORS.g2Line}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"></path>`);
      }
      if (nplLinePoints.length > 1) {
        parts.push(`<path d="${linePath(nplLinePoints)}" fill="none" stroke="${NPL_MIX_COLORS.nplLine}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"></path>`);
      }
      g2LinePoints.forEach(([x, y, point]) => {
        const tooltip = `${bank} ${point.period} — %G2: ${formatValue(point.g2Pct, "percent")}`;
        parts.push(`<circle data-tip="${escapeHTML(tooltip)}" cx="${x}" cy="${y}" r="3.2" fill="${NPL_MIX_COLORS.g2Line}"></circle>`);
      });
      nplLinePoints.forEach(([x, y, point]) => {
        const tooltip = `${bank} ${point.period} — %NPL: ${formatValue(point.nplPct, "percent")}`;
        parts.push(`<circle data-tip="${escapeHTML(tooltip)}" cx="${x}" cy="${y}" r="3.2" fill="${NPL_MIX_COLORS.nplLine}"></circle>`);
      });

      container.innerHTML = `<svg role="img" aria-label="${escapeHTML((sheet.title || sheet.name) + " — " + bank)}" viewBox="0 0 ${width} ${height}">${parts.join("")}</svg>`;
      wireTooltips(container);
    }

    function renderNplMixChart(index, sheet, panelEl) {
      const panel = panelEl || document.querySelector(`[data-panel="${index}"]`);
      if (!panel) {
        return;
      }
      const section = panel.querySelector('[data-npl-mix="true"]');
      if (!section) {
        return;
      }

      const target = section.querySelector(".market-chart-target");
      const { mode, bank } = state[index].nplMix || {};
      drawNplMixChart(target, sheet, mode, bank);
    }

    function drawMarketShareChart(container, sheet, rows, layout) {
      const usableRows = rows.filter((row) =>
        sheet.periods.some((period) => Number.isFinite(asNumber(row.values[period])))
      );

      if (!usableRows.length) {
        container.innerHTML = '<div class="empty">No data</div>';
        return;
      }

      const axis = sheet.axis;
      let yMin = 0;
      let yMax;
      const ticks = [];

      if (axis) {
        yMin = axis.min;
        yMax = axis.max;
        const stepCount = Math.max(1, Math.round((yMax - yMin) / axis.step));
        for (let i = 0; i <= stepCount; i += 1) {
          ticks.push(yMin + i * axis.step);
        }
      } else {
        const values = usableRows.flatMap((row) =>
          sheet.periods
            .map((period) => asNumber(row.values[period]))
            .filter((value) => Number.isFinite(value))
        );
        const largestValue = Math.max(0, ...values);
        yMax = largestValue || 1;
        for (let i = 0; i <= 4; i += 1) {
          ticks.push((yMax * i) / 4);
        }
      }

      const isCompact = layout === "two_by_two";
      const width = isCompact ? 560 : 980;
      const height = isCompact ? 250 : 360;
      const periodCount = Math.max(1, sheet.periods.length);
      const margin = { top: 18, right: 12, bottom: 44, left: sheet.format === "percent" ? 46 : 58 };
      const plotWidth = width - margin.left - margin.right;
      const plotHeight = height - margin.top - margin.bottom;
      const groupWidth = plotWidth / usableRows.length;
      const groupPadding = Math.min(14, groupWidth * 0.28);
      const barGap = periodCount > 12 ? 1 : 1.5;
      const barWidth = Math.max(2, Math.min(8, (groupWidth - groupPadding) / periodCount - barGap));
      const y = (value) => margin.top + (1 - (Math.min(Math.max(value, yMin), yMax) - yMin) / (yMax - yMin)) * plotHeight;
      const zeroY = y(0);
      const parts = [];

      ticks.forEach((tick) => {
        const tickY = y(tick);
        parts.push(`<line class="grid-line" x1="${margin.left}" y1="${tickY}" x2="${width - margin.right}" y2="${tickY}"></line>`);
        parts.push(`<text class="axis" x="${margin.left - 8}" y="${tickY + 4}" text-anchor="end">${escapeHTML(formatValue(tick, sheet.format))}</text>`);
      });
      parts.push(`<line class="zero-line" x1="${margin.left}" y1="${zeroY}" x2="${width - margin.right}" y2="${zeroY}"></line>`);

      usableRows.forEach((row, rowIndex) => {
        const groupStart = margin.left + rowIndex * groupWidth + groupPadding / 2;
        const groupCenter = margin.left + rowIndex * groupWidth + groupWidth / 2;

        const highlightColor = bankHighlightColor(row.ticker);
        if (highlightColor) {
          parts.push(`<rect x="${margin.left + rowIndex * groupWidth}" y="${margin.top}" width="${groupWidth}" height="${plotHeight}" fill="${highlightColor}"></rect>`);
        }

        sheet.periods.forEach((period, periodIndex) => {
          const value = asNumber(row.values[period]);
          if (!Number.isFinite(value)) {
            return;
          }

          const barX = groupStart + periodIndex * (barWidth + barGap);
          const barY = y(value);
          const barHeight = Math.max(1, zeroY - barY);
          const label = formatValue(value, sheet.format);
          const tooltip = `${row.ticker} ${period}: ${label}`;

          parts.push(`<rect data-tip="${escapeHTML(tooltip)}" x="${barX}" y="${barY}" width="${barWidth}" height="${barHeight}" rx="2" fill="${periodColor(periodIndex, period)}"></rect>`);
        });

        parts.push(`<text class="axis-strong" x="${groupCenter}" y="${height - 17}" text-anchor="middle">${escapeHTML(row.ticker)}</text>`);
      });

      const benchmark = findAcbBenchmark(sheet);
      if (benchmark !== null) {
        drawAcbBenchmark(
          parts,
          y(benchmark),
          margin.left,
          width - margin.right,
          benchmarkLabel(sheet, benchmark)
        );
      }

      container.innerHTML = `<svg role="img" aria-label="${escapeHTML(sheet.title || sheet.name)}" viewBox="0 0 ${width} ${height}">${parts.join("")}</svg>`;
      wireTooltips(container);
    }

    function drawComparison(index) {
      const sheet = workbookData.sheets[index];
      const panel = document.querySelector(`[data-panel="${index}"]`);
      const { rows, points } = getValuePoints(sheet, index);
      renderLegend(panel, sheet);
      drawGroupedBarChart(panel.querySelector(".comparison-chart"), sheet, rows, points);
    }

    function renderStats(index) {
      const sheet = workbookData.sheets[index];
      const panel = document.querySelector(`[data-panel="${index}"]`);
      if (sheet.type === "market_share") {
        const filter = state[index].filter.trim().toLowerCase();
        const marketSheets = sheet.sections ? sheet.sections.flatMap((section) => section.sheets || []) : sheet.sheets;

          return item.rows.filter((row) =>
            row.ticker.toLowerCase().includes(filter) ||
            String(row.group).toLowerCase().includes(filter)

    function almLabelTextColor(hexColor) {

      const b = parseInt(hex.slice(4, 6), 16);

    function buildAlmSpectrumChartHTML(title, periods, section, bank, note) {
      const categories = section.categories;
      const colors = section.colors;
      const values = section.series[bank] || {};

      if (!periods.length || !categories.length) {
        return `<section class="chart-panel appendix-tier-chart"><h2>${escapeHTML(title)}</h2><div class="empty">No data found</div></section>`;
      }

      const rowsHtml = periods
        .map((period, periodIndex) => {
          const entries = categories.map((name) => [name, asNumber((values[name] || [])[periodIndex]) || 0]);
          const total = entries.reduce((sum, [, value]) => sum + Math.max(value, 0), 0);
          const segments = entries
            .map(([name, value]) => {
              const share = total > 0 ? (Math.max(value, 0) / total) * 100 : 0;
              if (share <= 0) {
                return "";
              }
              const color = colors[name];
              const labelHtml = share > 1
                ? `<span style="font-size:10px;font-weight:800;line-height:1;color:${almLabelTextColor(color)};white-space:nowrap;">${share.toFixed(0)}%</span>`
                : "";
              const tip = `${name}: ${almNumberFormat.format(value)} (${share.toFixed(1)}%)`;
              return `<div style="flex-grow:${share.toFixed(4)};background:${color};min-width:1px;display:flex;align-items:center;justify-content:center;overflow:hidden;" title="${escapeHTML(tip)}">${labelHtml}</div>`;
            })
            .join("");

          return `
            <div class="appendix-bar-row" style="min-height:34px;">
              <span class="appendix-bar-label">${escapeHTML(period)}</span>
              <div class="appendix-bar-track" style="display:flex;gap:2px;height:20px;">${segments}</div>
              <span class="appendix-bar-value">${almNumberFormat.format(total)}</span>
            </div>

        })
        .join("");

      const legendHtml = categories
        .map((name) => `
          <span class="legend-item">
            <span class="legend-swatch" style="background:${colors[name]}"></span>
            ${escapeHTML(name)}
          </span>
        `)
        .join("");

      const noteHtml = note ? `<p class="positioning-note">${escapeHTML(note)}</p>` : "";

      return `

          <h2>${escapeHTML(title)}</h2>

          ${rowsHtml}

    function drawSpiderChart(container, sheet, banks) {
      const categories = sheet.categories;
      if (!banks.length || !categories.length) {
        container.innerHTML = '<div class="empty">No data</div>';
        return;
      }

      const maxValue = 10;
      const size = 680;
      const center = size / 2;
      const labelPad = 98;
      const radius = center - labelPad;
      const axisCount = categories.length;
      const angleFor = (i) => (Math.PI * 2 * i) / axisCount - Math.PI / 2;
      const pointFor = (i, value) => {
        const r = (Math.max(0, Math.min(value, maxValue)) / maxValue) * radius;
        const angle = angleFor(i);
        return [center + r * Math.cos(angle), center + r * Math.sin(angle)];
      };

      const gridParts = [];
      const ringSteps = 5;

      for (let step = 1; step <= ringSteps; step += 1) {
        const r = (radius * step) / ringSteps;
        const points = categories
          .map((_, i) => {
            const angle = angleFor(i);
            return `${center + r * Math.cos(angle)},${center + r * Math.sin(angle)}`;
          })
          .join(" ");
        gridParts.push(`<polygon points="${points}" fill="none" stroke="#e6e8ec" stroke-width="1"></polygon>`);
      }

      categories.forEach((category, i) => {
        const angle = angleFor(i);
        const [edgeX, edgeY] = pointFor(i, maxValue);
        gridParts.push(`<line x1="${center}" y1="${center}" x2="${edgeX}" y2="${edgeY}" stroke="#dadde2" stroke-width="1"></line>`);

        const labelX = center + (radius + 28) * Math.cos(angle);
        const labelY = center + (radius + 28) * Math.sin(angle);
        const anchor = Math.abs(Math.cos(angle)) < 0.15 ? "middle" : Math.cos(angle) > 0 ? "start" : "end";
        gridParts.push(`<text class="axis" x="${labelX}" y="${labelY}" text-anchor="${anchor}" dominant-baseline="middle">${escapeHTML(category)}</text>`);
      });

      const highlightPointRadius = 5;
      const highlightStrokeWidth = 3;
      const highlightFillOpacity = 0.16;

      const seriesParts = banks.map((bank) => {
        const color = ecoBankColor(sheet, bank.ticker);
        const points = categories.map((category, i) => pointFor(i, asNumber(bank.values[category]) || 0));
        const pointsAttr = points.map(([x, y]) => `${x},${y}`).join(" ");
        const pointParts = points
          .map(([x, y], i) => {
            const value = asNumber(bank.values[categories[i]]);
            const label = Number.isFinite(value) ? numberFormat.format(value) : "0";
            const tooltip = `${bank.ticker} ${categories[i]}: ${label}`;
            return `<circle data-tip="${escapeHTML(tooltip)}" cx="${x}" cy="${y}" r="${highlightPointRadius}" fill="${color}"></circle>`;
          })
          .join("");
        return `<g class="spider-series" data-ticker="${escapeHTML(bank.ticker)}"><polygon points="${pointsAttr}" fill="${color}" fill-opacity="${highlightFillOpacity}" stroke="${color}" stroke-width="${highlightStrokeWidth}"></polygon>${pointParts}</g>`;
      });

      container.innerHTML = `<svg role="img" aria-label="${escapeHTML(sheet.name + " spider chart")}" viewBox="0 0 ${size} ${size}"><g class="spider-grid" pointer-events="none">${gridParts.join("")}</g>${seriesParts.join("")}</svg>`;
      wireTooltips(container);
    }

    const RELATIVE_POSITION_POLE_POSITIVE = "#2d5f9f";
    const RELATIVE_POSITION_POLE_NEGATIVE = "#b3485d";
    const RELATIVE_POSITION_MIDPOINT = "#f0efec";

    function hexToRgb(hex) {
      const value = parseInt(hex.replace("#", ""), 16);
      return [(value >> 16) & 255, (value >> 8) & 255, value & 255];
    }

    function mixHex(hexA, hexB, t) {
      const a = hexToRgb(hexA);
      const b = hexToRgb(hexB);
      const mixed = a.map((channel, i) => Math.round(channel + (b[i] - channel) * t));
      return `#${mixed.map((channel) => channel.toString(16).padStart(2, "0")).join("")}`;
    }

    function relativeLuminance(hex) {
      const channel = (c) => {
        const v = c / 255;
        return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
      };
      const [r, g, b] = hexToRgb(hex).map(channel);
      return 0.2126 * r + 0.7152 * g + 0.0722 * b;
    }

    function contrastRatio(hexA, hexB) {
      const la = relativeLuminance(hexA);
      const lb = relativeLuminance(hexB);
      const lighter = Math.max(la, lb);
      const darker = Math.min(la, lb);
      return (lighter + 0.05) / (darker + 0.05);
    }

    function relativePositionCellStyle(targetEdge) {
      const intensity = Math.min(Math.abs(targetEdge) / 100, 1);
      const pole = targetEdge >= 0 ? RELATIVE_POSITION_POLE_POSITIVE : RELATIVE_POSITION_POLE_NEGATIVE;
      const background = mixHex(RELATIVE_POSITION_MIDPOINT, pole, intensity);
      const darkInk = "#0b0b0b";
      const lightInk = "#ffffff";
      const text = contrastRatio(background, darkInk) >= contrastRatio(background, lightInk) ? darkInk : lightInk;
      return { background, text };
    }

    function buildRelativePositionPanel(sheet, index) {
      const panel = document.createElement("article");
      panel.className = "sheet-panel eco-score-panel relative-position-panel";
      panel.dataset.panel = index;
      panel.innerHTML = `
        <header class="sheet-header">
          <div>
            <p class="eyebrow">Overview</p>
            <h1 class="sheet-title">${escapeHTML(sheet.name)}</h1>
          </div>
          <div class="stats" aria-live="polite"></div>
        </header>

        <section class="toolbar" aria-label="Target bank selection">
          <label class="field" style="min-width: 100%;">
            <span>Compare peers against</span>
            <div class="eco-ticker-picker relative-position-picker"></div>
          </label>
        </section>

        <div class="positioning-wrap">
          <div class="positioning-note"></div>
          <div class="positioning-legend">
            <span class="legend-edge" data-edge="behind"></span>
            <span class="legend-bar" style="background:linear-gradient(to right, ${RELATIVE_POSITION_POLE_NEGATIVE}, ${RELATIVE_POSITION_MIDPOINT}, ${RELATIVE_POSITION_POLE_POSITIVE});"></span>
            <span class="legend-edge" data-edge="ahead"></span>
          </div>
          <div class="table-scroll">
            <table class="eco-tick-table positioning-table">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      `;

      const defaultBank = sheet.banks.find((bank) => bank.ticker.toUpperCase() === "ACB") || sheet.banks[0];
      state[index] = {
        selected: defaultBank ? defaultBank.ticker : null
      };

      const picker = panel.querySelector(".relative-position-picker");
      picker.innerHTML = sheet.banks
        .map((bank) => `
          <button type="button" class="eco-ticker-chip${bank.ticker === state[index].selected ? " active" : ""}" data-ticker="${escapeHTML(bank.ticker)}">
            ${escapeHTML(bank.ticker)}
          </button>
        `)
        .join("");

      picker.addEventListener("click", (event) => {
        const button = event.target.closest(".eco-ticker-chip");
        if (!button) {
          return;
        }

        state[index].selected = button.dataset.ticker;

        picker.querySelectorAll(".eco-ticker-chip").forEach((chip) => {
          chip.classList.toggle("active", chip.dataset.ticker === state[index].selected);
        });

        renderRelativePositionPanel(index);
      });

      return panel;
    }

    function renderRelativePositionPanel(index) {
      const sheet = workbookData.sheets[index];
      const panel = document.querySelector(`[data-panel="${index}"]`);
      const target = state[index].selected;
      const targetBank = sheet.banks.find((bank) => bank.ticker === target);
      const peers = sheet.banks.filter((bank) => bank.ticker !== target);

      panel.querySelector(".stats").innerHTML = `
        <div class="stat"><span>Target</span><strong>${escapeHTML(target || "N/A")}</strong></div>
        <div class="stat"><span>Peers</span><strong>${peers.length}</strong></div>
        <div class="stat"><span>Metrics</span><strong>${sheet.metrics.length}</strong></div>
      `;

      const note = panel.querySelector(".positioning-note");
      note.innerHTML = target
        ? [
            `Each score is how far a peer sits from ${escapeHTML(target)} on that metric`,
            "Normalized to the peer group's range (-100 to +100)",
            "Positive means the peer is ahead",
            "Negative means the target is ahead",
          ].map((line) => `<p>${line}</p>`).join("")
        : "<p>Select a bank above to see how its peers compare on each metric.</p>";

      const edges = panel.querySelectorAll(".legend-edge");
      edges.forEach((edge) => {
        edge.textContent = edge.dataset.edge === "ahead" ? `${target || "Target"} ahead` : `${target || "Target"} behind`;
      });

      const ranges = sheet.metrics.map((metric) => {
        const values = sheet.banks
          .map((bank) => asNumber(bank.values[metric.key]))
          .filter((value) => Number.isFinite(value));
        return { min: Math.min(...values), max: Math.max(...values) };
      });

      const headerCells = sheet.metrics
        .map((metric) => `<th class="eco-cat-header">${escapeHTML(metric.label)}</th>`)
        .join("");
      panel.querySelector("thead").innerHTML = `<tr><th>Bank</th>${headerCells}</tr>`;

      const bodyRows = peers
        .map((bank) => {
          const cells = sheet.metrics
            .map((metric, metricIndex) => {
              const peerValue = asNumber(bank.values[metric.key]);
              const targetValue = targetBank ? asNumber(targetBank.values[metric.key]) : NaN;
              const { min, max } = ranges[metricIndex];
              const range = max - min;

              if (!Number.isFinite(peerValue) || !Number.isFinite(targetValue) || !range) {
                return `<td class="eco-tick-cell">&mdash;</td>`;
              }

              const score = ((peerValue - targetValue) / range) * 100;
              const { background, text } = relativePositionCellStyle(-score);
              const rounded = Math.round(score);
              const label = rounded === 0 ? "0" : `${rounded > 0 ? "+" : ""}${rounded}`;
              const tooltip = `${bank.ticker} vs ${target} — ${metric.label}: ${label} pts`;
              return `<td style="background:${background};color:${text};" title="${escapeHTML(tooltip)}">${escapeHTML(label)}</td>`;
            })
            .join("");
          return `<tr><td><strong>${escapeHTML(bank.ticker)}</strong></td>${cells}</tr>`;
        })
        .join("");

      panel.querySelector("tbody").innerHTML = bodyRows;
    }

    function buildStaticHtmlPanel(sheet, index, eyebrow) {
      const panel = document.createElement("article");
      panel.className = "sheet-panel";
      panel.dataset.panel = index;
      panel.innerHTML = `
        <header class="sheet-header">
          <div>
            <p class="eyebrow">${escapeHTML(eyebrow)}</p>
            <h1 class="sheet-title">${escapeHTML(sheet.name)}</h1>
          </div>
        </header>
        ${sheet.html}
      `;

      return panel;
    }

    function buildPanel(sheet, index) {
      if (sheet.type === "market_share") {
        return buildMarketSharePanel(sheet, index);
      }
      if (sheet.type === "eco_tick") {
        return buildEcoTickPanel(sheet, index);
      }
      if (sheet.type === "eco_score") {
        return buildEcoScorePanel(sheet, index);
      }
      if (sheet.type === "relative_position") {
        return buildRelativePositionPanel(sheet, index);
      }
      if (sheet.type === "swot") {
        return buildStaticHtmlPanel(sheet, index, "SWOT");
      }
      if (sheet.type === "appendix") {
        return buildStaticHtmlPanel(sheet, index, "Appendix");
      }
      if (sheet.type === "disclaimer") {
        return buildStaticHtmlPanel(sheet, index, "Disclaimer");
      }
      if (sheet.type === "next_chapter") {
        return buildStaticHtmlPanel(sheet, index, "Next Chapter at ACB");
      }
      if (sheet.type === "alm") {
        return buildStaticHtmlPanel(sheet, index, "Asset Structure");
      }

      const panel = document.createElement("article");
      panel.className = "sheet-panel";
      panel.dataset.panel = index;
      panel.innerHTML = `
        <header class="sheet-header">
          <div>
            <p class="eyebrow">Overview</p>
            <h1 class="sheet-title"></h1>
          </div>
          <div class="stats" aria-live="polite"></div>
        </header>

        <div class="chart-grid">
          <section class="chart-panel">
            <h2>All periods by bank ticker</h2>
            <div class="legend period-legend"></div>
            <div class="chart-scroll comparison-chart"></div>
          </section>
        </div>

        <section class="table-panel">
          <h2>Data table</h2>
          <div class="table-scroll">
            <table>
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
      `;

      panel.querySelector(".sheet-title").textContent = sheet.name;

      state[index] = {
        filter: ""
      };

      return panel;
    }

    function setupDashboard() {
      const tabs = document.getElementById("sheetTabs");
      const swotTabs = document.getElementById("swotTabs");
      const swotStart = workbookData.swotStartIndex;
      const swotEnd = workbookData.swotEndIndex;
      const appendixTabs = document.getElementById("appendixTabs");
      const appendixStart = workbookData.appendixStartIndex;
      const appendixEnd = workbookData.appendixEndIndex;
      const disclaimerTabs = document.getElementById("disclaimerTabs");
      const disclaimerStart = workbookData.disclaimerStartIndex;
      const disclaimerEnd = workbookData.disclaimerEndIndex;
      const nextChapterTabs = document.getElementById("nextChapterTabs");
      const nextChapterStart = workbookData.nextChapterStartIndex;
      const nextChapterEnd = workbookData.nextChapterEndIndex;
      const content = document.getElementById("content");

      workbookData.sheets.forEach((sheet, index) => {
        const button = document.createElement("button");
        button.className = "sheet-tab";
        button.type = "button";
        button.dataset.index = index;
        button.textContent = sheet.name;
        button.addEventListener("click", () => activateSheet(index));

        if (disclaimerTabs && index >= disclaimerStart && index < disclaimerEnd) {
          disclaimerTabs.appendChild(button);
        } else if (nextChapterTabs && nextChapterStart !== null && index >= nextChapterStart && index < nextChapterEnd) {
          nextChapterTabs.appendChild(button);
        } else if (appendixTabs && appendixStart !== null && index >= appendixStart && index < appendixEnd) {
          appendixTabs.appendChild(button);
        } else if (swotTabs && swotStart !== null && index >= swotStart && index < swotEnd) {
          swotTabs.appendChild(button);
        } else {
          tabs.appendChild(button);
        }

        content.appendChild(buildPanel(sheet, index));
      });

      if (workbookData.sheets.length) {
        activateSheet(0);
      } else {
        content.innerHTML = '<div class="empty">No workbook data found</div>';
      }
    }

    setupDashboard();
  </script>
</body>
</html>
