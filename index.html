<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACB Bank Dashboard</title>
  <style>
    :root {
      --bg: #f7f5ef;
      --paper: #ffffff;
      --ink: #20242b;
      --muted: #667085;
      --line: #dadde2;
      --teal: #127c72;
      --teal-soft: #e7f3f1;
      --rose: #b3485d;
      --blue: #2d5f9f;
      --amber: #c87d1d;
      --green: #4f8f47;
      --shadow: 0 16px 40px rgba(32, 36, 43, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    select {
      font: inherit;
      letter-spacing: 0;
    }

    .app {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      border-right: 1px solid var(--line);
      background: #fcfbf8;
      padding: 22px 16px;
    }

    .brand {
      margin-bottom: 22px;
    }

    .brand h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.1;
    }

    .brand p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .overview-field {
      width: 100%;
    }

    .sidebar .overview-field span {
      font-size: 16px;
      font-weight: 800;
      color: var(--ink);
    }

    .tab-list {
      display: grid;
      gap: 6px;
    }

    .sheet-tab {
      width: 100%;
      max-width: 100%;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      padding: 10px 12px;
      text-align: left;
      font-size: 13px;
      white-space: normal;
      overflow-wrap: break-word;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    .sheet-tab:hover {
      background: #f0ede4;
    }

    .sheet-tab.active {
      background: var(--teal-soft);
      border-color: #b9dcd7;
      color: #0f6159;
      font-weight: 700;
    }

    .content {
      min-width: 0;
      padding: 28px;
    }

    .sheet-panel {
      display: none;
      max-width: 1380px;
      margin: 0 auto;
    }

    .sheet-panel.active {
      display: block;
    }

    .sheet-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--teal);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .sheet-title {
      margin: 0;
      font-size: 34px;
      line-height: 1.05;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      max-width: 560px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      padding: 8px 10px;
      min-width: 118px;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .stat strong {
      display: block;
      margin-top: 3px;
      font-size: 14px;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 12px;
      margin-bottom: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
      padding: 14px;
    }

    .field {
      display: grid;
      gap: 5px;
      min-width: 160px;
    }

    .field span,
    .check span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    select,
    input[type="search"] {
      height: 38px;
      min-width: 0;
      border: 1px solid #cfd4dc;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 0 10px;
      outline: none;
    }

    select:focus,
    input[type="search"]:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(18, 124, 114, 0.14);
    }

    .check {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 38px;
      padding: 0 8px;
    }

    .check input {
      width: 18px;
      height: 18px;
      accent-color: var(--teal);
    }

    .chart-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 16px;
      align-items: stretch;
    }

    .chart-panel,
    .table-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .chart-panel {
      padding: 16px;
    }

    .chart-panel h2,
    .table-panel h2 {
      margin: 0 0 12px;
      font-size: 17px;
    }

    .appendix-tier-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      align-items: start;
    }

    .appendix-tier-chart {
      display: grid;
      gap: 10px;
    }

    .appendix-tier-chart .eyebrow {
      margin: -6px 0 2px;
    }

    .appendix-bar-row {
      display: grid;
      grid-template-columns: minmax(44px, 54px) minmax(0, 1fr) minmax(86px, auto);
      gap: 10px;
      align-items: center;
      min-height: 28px;
      font-size: 12px;
    }

    .appendix-bar-label {
      font-weight: 800;
      color: var(--ink);
      overflow-wrap: anywhere;
    }

    .appendix-bar-track {
      height: 14px;
      border-radius: 999px;
      background: #eef1f4;
      overflow: hidden;
      border: 1px solid #d9dde4;
    }

    .appendix-bar-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--teal), var(--blue));
    }

    .appendix-bar-value {
      color: #4d5766;
      font-weight: 800;
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .appendix-rationale-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      align-items: stretch;
    }

    .appendix-rationale-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
      padding: 14px;
      min-height: 116px;
    }

    .appendix-rationale-card h2 {
      margin: 0 0 8px;
      color: var(--teal);
      font-size: 15px;
      line-height: 1.25;
    }

    .appendix-rationale-card p {
      margin: 0;
      color: #363c46;
      font-size: 13px;
      line-height: 1.5;
    }

    .disclaimer-intro {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
      padding: 16px 18px;
      margin-bottom: 16px;
    }

    .disclaimer-intro h2 {
      margin: 0 0 8px;
      color: var(--teal);
      font-size: 18px;
    }

    .disclaimer-intro p,
    .disclaimer-source p {
      margin: 0;
      color: #363c46;
      line-height: 1.55;
    }

    .disclaimer-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .disclaimer-card {
      border: 1px solid var(--line);
      border-top: 4px solid var(--teal);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
      padding: 16px 18px;
      min-height: 150px;
    }

    .disclaimer-card h2 {
      margin: 0 0 8px;
      color: var(--ink);
      font-size: 16px;
      line-height: 1.3;
    }

    .disclaimer-card p {
      margin: 0;
      color: #363c46;
      font-size: 13px;
      line-height: 1.55;
    }

    .disclaimer-source {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfaf7;
      padding: 14px 16px;
      margin-top: 16px;
    }

    .appendix-tab-sections {
      display: grid;
      gap: 18px;
    }

    .appendix-section > h2 {
      margin: 0 0 12px;
      color: var(--teal);
      font-size: 18px;
      line-height: 1.3;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #4d5766;
      font-size: 12px;
      font-weight: 700;
    }

    .legend-swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      border: 1px solid rgba(32, 36, 43, 0.12);
    }

    .chart-scroll {
      overflow-x: auto;
      padding-bottom: 4px;
    }

    svg {
      display: block;
      width: 100%;
      min-width: 680px;
      height: auto;
    }

    .axis {
      fill: #697386;
      font-size: 12px;
    }

    .axis-strong {
      fill: #20242b;
      font-size: 13px;
      font-weight: 800;
    }

    .grid-line {
      stroke: #e6e8ec;
      stroke-width: 1;
    }

    .zero-line {
      stroke: #9aa3af;
      stroke-width: 1.4;
    }

    .bar-label {
      fill: #20242b;
      font-size: 12px;
      font-weight: 700;
    }

    svg rect[data-tip] {
      cursor: pointer;
    }

    svg rect[data-tip]:hover {
      opacity: 0.82;
    }

    .chart-tooltip {
      position: fixed;
      z-index: 50;
      max-width: 260px;
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(32, 36, 43, 0.94);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.4;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -100%);
      transition: opacity 100ms ease;
      white-space: nowrap;
    }

    .chart-tooltip.visible {
      opacity: 1;
    }

    .market-grid {
      display: grid;
      gap: 12px;
    }

    .market-grid-single {
      grid-template-columns: minmax(0, 1fr);
    }

    .market-grid-2x2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .market-grid-3x1 {
      grid-template-columns: minmax(0, 1fr);
    }

    .market-chart {
      padding: 12px;
    }

    .market-chart h2 {
      margin-bottom: 6px;
      font-size: 15px;
    }

    .market-section {
      display: grid;
      gap: 12px;
      margin-bottom: 18px;
    }

    .market-section:last-child {
      margin-bottom: 0;
    }

    .market-section-title {
      margin: 0;
      color: var(--teal);
      font-size: 18px;
      line-height: 1.3;
    }

    .market-extra {
      margin-top: 18px;
    }

    .market-chart .chart-scroll {
      overflow: hidden;
    }

    .market-chart svg {
      min-width: 0;
    }

    .market-share-panel .sheet-header {
      margin-bottom: 10px;
    }

    .market-share-panel .toolbar {
      margin-bottom: 10px;
      padding: 10px;
    }

    .market-share-panel .legend {
      margin-bottom: 10px;
    }

    .market-share-panel .legend-item {
      font-size: 11px;
    }

    .empty {
      display: grid;
      place-items: center;
      min-height: 260px;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 8px;
    }

    .table-panel {
      margin-top: 16px;
      overflow: hidden;
    }

    .table-panel h2 {
      padding: 16px 16px 0;
    }

    .table-scroll {
      overflow: auto;
      max-height: 460px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
      font-size: 13px;
    }

    .appendix-table-compact {
      min-width: 0;
      table-layout: fixed;
      font-size: 13px;
    }

    .appendix-table-compact th,
    .appendix-table-compact td {
      white-space: normal;
      vertical-align: top;
      line-height: 1.45;
      text-align: left;
    }

    .appendix-table-compact th:first-child,
    .appendix-table-compact td:first-child {
      width: 28%;
      max-width: 260px;
      font-weight: 800;
      color: var(--ink);
    }

    .appendix-table-compact th:nth-child(2),
    .appendix-table-compact td:nth-child(2) {
      width: 72%;
    }

    th,
    td {
      border-top: 1px solid #edf0f3;
      padding: 9px 10px;
      text-align: right;
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #fbfaf7;
      color: #4d5766;
      font-size: 12px;
      text-transform: uppercase;
    }

    th:first-child,
    td:first-child,
    th:nth-child(2),
    td:nth-child(2) {
      text-align: left;
    }

    tbody tr:hover {
      background: #f8fbfa;
    }

    .group-pill {
      display: inline-flex;
      min-width: 42px;
      justify-content: center;
      border-radius: 999px;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 7px;
    }

    .eco-tick-table {
      table-layout: fixed;
      min-width: 0;
      width: 100%;
    }

    .eco-tick-table th,
    .eco-tick-table td {
      border: 1px solid #e6e8ec;
      white-space: normal;
      word-break: break-word;
    }

    .eco-tick-table th:first-child,
    .eco-tick-table td:first-child {
      width: 76px;
    }

    .eco-group-header {
      position: static;
      font-size: 11px;
      background: var(--teal-soft);
      color: var(--teal);
    }

    .eco-group-1 {
      background: #fbeedd;
      color: var(--amber);
    }

    .eco-cat-header {
      font-size: 10px;
      line-height: 1.25;
      padding: 6px 4px;
    }

    .eco-tick-table th.eco-group-header,
    .eco-tick-table th.eco-cat-header,
    .eco-tick-table td.eco-tick-cell {
      text-align: center;
    }

    .eco-tick-cell {
      color: var(--muted);
    }

    .eco-tick-yes {
      color: var(--green);
      font-weight: 800;
      font-size: 15px;
    }

    .eco-row-highlight,
    .eco-row-highlight:hover {
      background: #123a63;
    }

    .eco-row-highlight td {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .eco-row-highlight .eco-tick-cell {
      color: rgba(255, 255, 255, 0.55);
    }

    .eco-row-highlight .eco-tick-yes {
      color: #7ee787;
    }

    .positioning-note {
      color: var(--muted);
      font-size: 13px;
      margin-top: 0;
    }

    .positioning-legend {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .legend-bar {
      display: inline-block;
      width: 160px;
      height: 10px;
      border-radius: 5px;
      border: 1px solid rgba(32, 36, 43, 0.12);
    }

    .legend-edge {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .positioning-table th:first-child,
    .positioning-table td:first-child {
      width: 96px;
      text-align: left;
    }

    .group-tag {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
    }

    .positioning-table td {
      position: relative;
    }

    .box-badge {
      position: absolute;
      top: -7px;
      left: -7px;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--amber);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      line-height: 15px;
      text-align: center;
      z-index: 1;
    }

    .positioning-notes {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .positioning-note-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .positioning-note-item p {
      margin: 0;
      font-size: 13px;
      line-height: 1.55;
    }

    .zone-badge {
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--amber);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      line-height: 18px;
      text-align: center;
      margin-top: 2px;
    }

    .positioning-overall {
      margin: 4px 0 0;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      font-size: 13px;
      line-height: 1.55;
    }

    .swot-panel > h3 {
      margin: 20px 0 4px;
      font-size: 15px;
    }

    .swot-glance {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 8px;
    }

    .swot-glance-cell {
      border: 1px solid var(--line);
      border-top: 3px solid;
      border-radius: 8px;
      padding: 14px 16px;
    }

    .swot-glance-cell h4 {
      margin: 0 0 8px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .swot-glance-cell ul {
      margin: 0;
      padding-left: 18px;
      line-height: 1.55;
      font-size: 13px;
      color: var(--ink);
    }

    .swot-glance-cell li {
      margin-bottom: 4px;
    }

    .swot-glance-cell li:last-child {
      margin-bottom: 0;
    }

    .eco-score-chart svg {
      min-width: 0;
      max-width: 600px;
      margin: 0 auto;
    }

    .eco-score-panel .sheet-header {
      margin-bottom: 10px;
    }

    .eco-score-panel .toolbar {
      margin-bottom: 10px;
      padding: 10px 12px;
    }

    .eco-score-panel .chart-grid {
      gap: 10px;
    }

    .eco-score-panel .chart-panel {
      padding: 10px 14px 12px;
    }

    .eco-score-panel .chart-panel h2 {
      margin-bottom: 2px;
    }

    .eco-score-panel .eco-ticker-chip {
      padding: 4px 8px;
      font-size: 11px;
    }

    .eco-ticker-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .eco-ticker-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 10px;
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease, color 120ms ease, opacity 120ms ease;
    }

    .eco-ticker-chip:hover {
      border-color: #b9dcd7;
    }

    .eco-ticker-chip.active {
      background: var(--teal-soft);
      border-color: #b9dcd7;
      color: #0f6159;
    }

    .eco-ticker-chip:not(.active) {
      opacity: 0.55;
    }

    .spider-series circle {
      cursor: pointer;
    }

    .subsection {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--paper);
      box-shadow: var(--shadow);
      padding: 16px 18px;
      margin-bottom: 14px;
    }

    .subsection h3 {
      margin: 0 0 8px;
      font-size: 15px;
    }

    .subsection p {
      margin: 0 0 8px;
      line-height: 1.6;
      color: #363c46;
    }

    .subsection p:last-child {
      margin-bottom: 0;
    }

    .subsection ul {
      margin: 0 0 8px;
      padding-left: 20px;
      line-height: 1.6;
      color: #363c46;
    }

    .chart-figure {
      margin: 12px 0 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfaf7;
      padding: 12px 14px;
    }

    .chart-multi {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .chart-sub {
      flex: 1 1 320px;
      min-width: 0;
    }

    .chart-sub h4 {
      margin: 0 0 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .next-chapter-body p {
      margin: 0 0 12px;
      line-height: 1.6;
      color: #363c46;
    }

    .next-chapter-body ul {
      margin: 0 0 12px;
      padding-left: 20px;
      line-height: 1.6;
      color: #363c46;
    }

    .next-chapter-body > *:last-child {
      margin-bottom: 0;
    }

    .next-chapter-subheading {
      margin: 22px 0 10px;
      font-size: 15px;
      color: var(--teal);
    }

    .next-chapter-subheading:first-child {
      margin-top: 0;
    }

    .plan-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .plan-table th,
    .plan-table td {
      border: 1px solid var(--line);
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
    }

    .plan-table th {

      box-shadow: var(--shadow);

      flex-wrap: wrap;

    }

      grid-auto-flow: column;
      grid-auto-columns: 1fr;
    }

      flex: 1 1 280px;
      min-width: 0;

      padding: 16px 18px;
    }

      margin: 0 0 10px;
      font-size: 15px;

      margin: 0;
      color: #363c46;
      line-height: 1.5;
    }

    .info-card-section ul {
      margin: 0;
      padding-left: 18px;
      color: #363c46;
      line-height: 1.5;
    }

    .info-card-section li + li {
      margin-top: 6px;
    }

      }

        border-right: 0;
        border-bottom: 1px solid var(--line);

      .tab-list {

        flex-wrap: wrap;

      }

      .sheet-tab {
        flex: 0 1 auto;
        width: auto;
        max-width: 100%;

      .content {

      .sheet-header {
        display: grid;
      }

      .stats {

      }

      .chart-grid {

      }

      .market-grid {
        grid-template-columns: 1fr;
      }

      .appendix-tier-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .appendix-rationale-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .disclaimer-grid {
        grid-template-columns: minmax(0, 1fr);
      }

" title=\"HDB vs ACB \u2014 CoF: -27 pts\">-27<\/td><td style=\"background:#ce939d;color:#0b0b0b;box-shadow:inset 3px 0 0 0 var(--amber);\" title=\"HDB vs ACB \u2014 YEA: +55 pts\">+55<\/td><td style=\"background:#d29ca5;color:#0b0b0b;\" title=\"HDB vs ACB \u2014 NIM: +50 pts\">+50<\/td><td style=\"background:#dfc1c5;color:#0b0b0b;\" title=\"HDB vs ACB \u2014 CIR: +27 pts\">+27<\/td><td style=\"background:#eee9e7;color:#0b0b0b;box-shadow:inset -3px 0 0 0 var(--amber);\" title=\"HDB vs ACB \u2014 %NFI: +3 pts\">+3<\/td><td style=\"background:#c4cfdb;color:#0b0b0b;box-shadow:inset 3px 0 0 0 var(--amber);\" title=\"HDB vs ACB \u2014 NPL: -22 pts\">-22<\/td><td style=\"background:#b8c6d6;color:#0b0b0b;box-shadow:inset -3px 0 0 0 var(--amber);\" title=\"HDB vs ACB \u2014 LLCR: -29 pts\">-29<\/td><td style=\"background:#e6d3d4;color:#0b0b0b;\" title=\"HDB vs ACB \u2014 ROAE: +17 pts\">+17<\/td><\/tr><tr><td><strong>SHB<\/strong><\/td><td style=\"background:#e9eae9;color:#0b0b0b;\" title=\"SHB vs ACB \u2014 Total Mkt Share: -4 pts\">-4<\/td><td style=\"background:#e1e4e6;color:#0b0b0b;\" title=\"SHB vs ACB \u2014 Retail Mkt Share: -8 pts\">-8<\/td><td style=\"background:#eaebea;color:#0b0b0b;\" title=\"SHB vs ACB \u2014 Wholesale Mkt Share: -3 pts\">-3<\/td><td style=\"background:#99afca;color:#0b0b0b;box-shadow:inset 3px 0 0 0 var(--amber);\" title=\"SHB vs ACB \u2014 CASA: -45 pts\">-45<\/td><td style=\"background:#99afca;color:#0b0b0b;box-shadow:inset -3px 0 0 0 var(--amber);\" title=\"SHB vs ACB \u2014 CoF: -45 pts\">-45<\/td><td style=\"background:#e1c6c8;color:#0b0b0b;box-shadow:inset 0 -3px 0 0 var(--amber), inset 3px 0 0 0 var(--amber);\" title=\"SHB vs ACB \u2014 YEA: +25 pts\">+25<\/td><td style=\"background:#e2e4e6;color:#0b0b0b;box-shadow:inset 0 -3px 0 0 var(--amber);\" title=\"SHB vs ACB \u2014 NIM: -7 pts\">-7<\/td><td style=\"background:#cf939e;color:#0b0b0b;box-shadow:inset 0 -3px 0 0 var(--amber);\" title=\"SHB vs ACB \u2014 CIR: +55 pts\">+55<\/td><td style=\"background:#e7d7d7;color:#0b0b0b;box-shadow:inset 0 -3px 0 0 var(--amber), inset -3px 0 0 0 var(--amber);\" title=\"SHB vs ACB \u2014 %NFI: +15 pts\">+15<\/td><td style=\"background:#c2cdda;color:#0b0b0b;box-shadow:inset 3px 0 0 0 var(--amber);\" title=\"SHB vs ACB \u2014 NPL: -23 pts\">-23<\/td><td style=\"background:#c8d2dc;color:#0b0b0b;box-shadow:inset -3px 0 0 0 var(--amber);\" title=\"SHB vs ACB \u2014 LLCR: -20 pts\">-20<\/td><td style=\"background:#8aa3c4;color:#0b0b0b;\" title=\"SHB vs ACB \u2014 ROAE: -52 pts\">-52<\/td><\/tr><tr><td><strong>STB<\/strong><\/td><td style=\"background:#e9eae9;color:#0b0b0b;\" title=\"STB vs ACB \u2014 Total Mkt Share: -4 pts\">-4<\/td><td style=\"background:#ede6e4;color:#0b0b0b;\" title=\"STB vs ACB \u2014 Retail Mkt Share: +5 pts\">+5<\/td><td style=\"background:#dfe3e5;color:#0b0b0b;\" title=\"STB vs ACB \u2014 Wholesale Mkt Share: -9 pts\">-9<\/td><td style=\"background:#c5d0db;color:#0b0b0b;box-shadow:inset 0 -3px 0 0 var(--amber), inset 3px 0 0 0 var(--amber);\" title=\"STB vs ACB \u2014 CASA: -22 pts\">-22<\/td><td style=\"background:#dee2e5;color:#0b0b0b;box-shadow:inset 0 -3px 0 0 var(--amber), inset -3px 0 0 0 var(--amber);\" title=\"STB vs ACB \u2014 CoF: -9 pts\">-9<\/td><td style=\"background:#e9dcdc;color:#0b0b0b;\" title=\"STB vs ACB \u2014 YEA: +11 pts\">+11<\/td><td style=\"background:#ebe1e0;color:#0b0b0b;\" title=\"STB vs ACB \u2014 NIM: +9 pts\">+9<\/td><td style=\"background:#98aec9;color:#0b0b0b;\" title=\"STB vs ACB \u2014 CIR: -45 pts\">-45<\/td><td style=\"background:#eeebe8;color:#0b0b0b;\" title=\"STB vs ACB \u2014 %NFI: +3 pts\">+3<\/td><td style=\"background:#a4b7ce;color:#0b0b0b;box-shadow:inset 0 -3px 0 0 var(--amber), inset 3px 0 0 0 var(--amber);\" title=\"STB vs ACB \u2014 NPL: -39 pts\">-39<\/td><td style=\"background:#b4c3d4;color:#0b0b0b;box-shadow:inset 0 -3px 0 0 var(--amber), inset -3px 0 0 0 var(--amber);\" title=\"STB vs ACB \u2014 LLCR: -31 pts\">-31<\/td><td style=\"background:#4d77ac;color:#ffffff;\" title=\"STB vs ACB \u2014 ROAE: -83 pts\">-83<\/td><\/tr><\/tbody><\/table><\/div><div class=\"positioning-notes\"><div class=\"positioning-note-item\"><span class=\"zone-badge\">1<\/span><p>Funding scale: the leaders set the benchmark. The three SOCBs (BID, CTG, VCB), together with MBB (anchored by its military-linked client network) and TCB (tech-led platform and broad corporate ecosystem), dominate on both total and wholesale market share. That scale translates into a structural funding advantage through a larger CASA base and lower cost of funds. Notably, BID&#x27;s CASA ratio is on par with ACB, so its cheaper funding reflects its state-owned deposit franchise rather than CASA mix. Meanwhile, ACB holds a larger retail market share than TCB, underscoring the depth of its retail franchise.<\/p><\/div><div class=\"positioning-note-item\"><span class=\"zone-badge\">2<\/span><p>ACB leads the private mid-tier on funding. ACB is clearly ahead of VPB, HDB, SHB and STB on both CASA and cost of funds, giving it a sustainable margin cushion within its private-bank peer group.<\/p><\/div><div class=\"positioning-note-item\"><span class=\"zone-badge\">3<\/span><p>Higher yield, higher margins, leaner cost base. Banks with consumer finance arms (VPB/FE Credit, HDB/HD Saison, MBB/Mcredit, SHB) outperform ACB on asset yield and NIM, reflecting their higher-risk, higher-yield lending mix, and they also run at lower cost-to-income ratios. TCB stands out on non-interest income, where its lead over ACB is by far the widest in the group, driven by its ecosystem and fee businesses. For the other banks the fee-income gap with ACB is small. SHB is the exception on margins: its higher yield does not carry through to NIM, as its funding cost weighs heavily.<\/p><\/div><div class=\"positioning-note-item\"><span class=\"zone-badge\">4<\/span><p>ACB&#x27;s clearest differentiator: asset quality. ACB stands out on NPL ratio and loan-loss coverage, with a wide lead over VPB, HDB, SHB and STB, reflecting disciplined credit underwriting and a prudent risk appetite. Against TCB and MBB, asset quality is broadly on par.<\/p><\/div><p class=\"positioning-overall\"><strong>Overall \u2014 <\/strong>Best-in-class risk-adjusted returns. Despite a lower-yield, lower-risk book, ACB&#x27;s cheap funding and clean asset quality deliver average ROAE ahead of most peers, including all three SOCBs, TCB, VPB, SHB and STB. Only HDB, and marginally MBB, generate higher returns.<\/p><\/div><\/div>"}, {"type": "swot", "name": "Strength", "html": "<article class=\"subsection\"><h3>1.1 Low-risk, well-capitalised franchise<\/h3><p>ACB delivers a top-tier average ROAE of 22.9% while maintaining a comfortable capital adequacy ratio (CAR) of 11.8% as of Q2-2026, after its cash dividend payment. These returns are achieved without the risk concentrations common among peers. The bank holds zero corporate bond investments and keeps credit exposure to real estate developers below 4% of total exposure.<\/p><p>This is a deliberate strategic choice. State-owned banks dominate financing for public infrastructure projects and FDI trade finance, while several private peers are heavily exposed to real estate developers. ACB avoids both designated national key projects and developer lending to stay within its risk appetite.<\/p><figure class=\"chart-figure\"><div class=\"chart-multi\"><div class=\"chart-sub\"><h4>ROAE<\/h4><div class=\"legend\"><span class=\"legend-item\"><span class=\"legend-swatch\" style=\"background:#d7ecff\"><\/span>2016<\/span><span class=\"legend-item\"><span class=\"legend-swatch\" style=\"background:#c5e2fb\"><\/span>2017<\/span><span class=\"legend-item\"><span class=\"legend-swatch\" style=\"background:#b2d8f7\"><\/span>2018<\/span><span class=\"legend-item\"><span class=\"legend-swatch\" style=\"background:#9dccf1\"><\/span>2019<\/span><span class=\"legend-item\"><span class=\"legend-swatch\" style=\"background:#86bdea\"><\/span>2020<\/s \" height=\"168.84000000000003\" rx=\"3\" fill=\"#559bd2\"><title>TCB 2022: 20.1%<\/title><\/rect><rect x=\"563.0\" y=\"130.88\" width=\"14\" height=\"183.12\" rx=\"3\" fill=\"#3f86c2\"><title>TCB 2023: 21.8%<\/title><\/rect><rect x=\"580.0\" y=\"170.35999999999999\" width=\"14\" height=\"143.64000000000001\" rx=\"3\" fill=\"#2f70ad\"><title>TCB 2024: 17.1%<\/title><\/rect><rect x=\"597.0\" y=\"176.23999999999998\" width=\"14\" height=\"137.76000000000002\" rx=\"3\" fill=\"#235a95\"><title>TCB 2025: 16.4%<\/title><\/rect><text class=\"axis-strong\" x=\"527.5\" y=\"338\" text-anchor=\"middle\">TCB<\/text><line x1=\"50\" y1=\"235.88000000000002\" x2=\"760\" y2=\"235.88000000000002\" stroke=\"#2d5f9f\" stroke-width=\"1.6\" stroke-dasharray=\"1 4\" stroke-linecap=\"round\"><\/line><circle cx=\"760\" cy=\"235.88000000000002\" r=\"3.5\" fill=\"#2d5f9f\"><\/circle><text x=\"760\" y=\"227.88000000000002\" text-anchor=\"end\" fill=\"#2d5f9f\" font-size=\"11\" font-weight=\"800\">ACB 2025: 9.3%<\/text><\/svg><\/div><\/div><\/div><\/figure><\/article>"}, {"type": "swot", "name": "Opportunity", "html": "<article class=\"subsection\"><h3>3.1 Risk-appetite headroom to capture higher yields from existing customers<\/h3><p>ACB&#x27;s conservative, secured book limits asset yields, which compounds the NIM pressure. The bank has room to raise yields selectively by offering higher-margin products, such as credit card cash advances, unsecured personal loans and cash-flow-based SME working capital, to customers it already knows. Transaction histories, salary flows and repayment records give ACB an underwriting advantage over consumer finance companies lending to new-to-bank borrowers, allowing it to price risk more accurately while staying within its risk appetite. Payroll accounts from its growing corporate client base would further widen this pool. The main constraint is capital: unsecured loans carry higher risk weights, and with CAR at 11.8%, expansion would need to be gradual.<\/p><\/article><article class=\"subsection\"><h3>3.2 Ecosystem build-out through subsidiary capitalisation<\/h3><p>Rather than pursuing M&amp;A, ACB is expanding its ecosystem organically by injecting capital into its subsidiaries:<\/p><ul><li>ACB Securities (ACBS): a planned VND 2 trillion capital increase in Q3-2026 to fund technology upgrades and expand margin lending. This builds on strong core growth, with margin lending revenue up 51% YoY in 2025. Digital wealth management through ACBS offers significant cross-selling potential with ACB&#x27;s retail customer base.<\/li><li>ACB Asset Management (ACBA): charter capital raised from VND 5 billion to VND 2,505 billion to strengthen collateral recovery and debt resolution, supporting group asset quality.<\/li><li>ACB Insurance (ACBI): a new non-life insurer targeting high-margin segments including property, fire and personal health insurance, which partly closes the ecosystem gap noted in 2.4.<\/li><\/ul><\/article><article class=\"subsection\"><h3>3.3 Digital platform: ACB ONE<\/h3><p>ACB ONE provides a scalable platform to grow online transaction volumes and lower long-term customer acquisition costs. Over time, higher transaction activity on the platform should gradually lift the CASA ratio, directly addressing the bank&#x27;s main weakness.<\/p><\/article><article class=\"subsection\"><h3>3.4 Corporate segment expansion<\/h3><p>ACB is shifting its portfolio away from lower-yielding short-term loans toward higher-yielding medium- and long-term lending to support NIM. Large-corporate (MMLC) lending is set to be the primary credit driver in 2026, with expected growth of 42% YoY, compared with 13% for SME and 15% for retail. If executed well, this expansion would help close the wholesale gap (2.3) and open new CASA and fee income channels.<\/p><figure class=\"chart-figure\"><div class=\"chart-multi\"><div class=\"chart-sub\"><h4>LongLend<\/h4><div class=\"legend\"><span class=\"legend-item\"><span class=\"legend-swatch ext class=\"axis-strong\" x=\"1673.5\" y=\"338\" text-anchor=\"middle\">HDB<\/text><rect x=\"1781.0\" y=\"269.9\" width=\"14\" height=\"44.10000000000002\" rx=\"3\" fill=\"#d7ecff\"><title>SHB 2016: 1.5%<\/title><\/rect><rect x=\"1798.0\" y=\"273.134\" width=\"14\" height=\"40.865999999999985\" rx=\"3\" fill=\"#c5e2fb\"><title>SHB 2017: 1.4%<\/title><\/rect><rect x=\"1815.0\" y=\"272.546\" width=\"14\" height=\"41.45400000000001\" rx=\"3\" fill=\"#b2d8f7\"><title>SHB 2018: 1.4%<\/title><\/rect><rect x=\"1832.0\" y=\"271.95799999999997\" width=\"14\" height=\"42.04200000000003\" rx=\"3\" fill=\"#9dccf1\"><title>SHB 2019: 1.4%<\/title><\/rect><rect x=\"1849.0\" y=\"270.782\" width=\"14\" height=\"43.21800000000002\" rx=\"3\" fill=\"#86bdea\"><title>SHB 2020: 1.5%<\/title><\/rect><rect x=\"1866.0\" y=\"264.60800000000006\" width=\"14\" height=\"49.39199999999994\" rx=\"3\" fill=\"#6eaddf\"><title>SHB 2021: 1.7%<\/title><\/rect><rect x=\"1883.0\" y=\"268.72400000000005\" width=\"14\" height=\"45.275999999999954\" rx=\"3\" fill=\"#559bd2\"><title>SHB 2022: 1.5%<\/title><\/rect><rect x=\"1900.0\" y=\"273.134\" width=\"14\" height=\"40.865999999999985\" rx=\"3\" fill=\"#3f86c2\"><title>SHB 2023: 1.4%<\/title><\/rect><rect x=\"1917.0\" y=\"275.78\" width=\"14\" height=\"38.22000000000003\" rx=\"3\" fill=\"#2f70ad\"><title>SHB 2024: 1.3%<\/title><\/rect><rect x=\"1934.0\" y=\"274.01599999999996\" width=\"14\" height=\"39.98400000000004\" rx=\"3\" fill=\"#235a95\"><title>SHB 2025: 1.4%<\/title><\/rect><text class=\"axis-strong\" x=\"1864.5\" y=\"338\" text-anchor=\"middle\">SHB<\/text><line x1=\"50\" y1=\"268.13599999999997\" x2=\"2010\" y2=\"268.13599999999997\" stroke=\"#2d5f9f\" stroke-width=\"1.6\" stroke-dasharray=\"1 4\" stroke-linecap=\"round\"><\/line><circle cx=\"2010\" cy=\"268.13599999999997\" r=\"3.5\" fill=\"#2d5f9f\"><\/circle><text x=\"2010\" y=\"260.13599999999997\" text-anchor=\"end\" fill=\"#2d5f9f\" font-size=\"11\" font-weight=\"800\">ACB 2025: 1.6%<\/text><\/svg><\/div><\/div><\/div><\/figure><\/article>"}, {"type": "swot", "name": "Threat", "html": "<article class=\"subsection\"><h3>4.1 Regulatory pressure<\/h3><p>SBV control over credit growth quotas constrains ACB&#x27;s ability to grow even when demand is available. SBV guidance for banks to cut lending rates and offer preferential yields also puts downward pressure on NIM across the sector.<\/p><\/article><article class=\"subsection\"><h3>4.2 Funding competition<\/h3><p>Systemic liquidity squeezes and aggressive deposit rate competition among private peers could push funding costs higher. The competition for retail deposits is intensifying further with the rise of digital banks, such as VPBank&#x27;s Cake, HDBank&#x27;s Vikki and MB&#x27;s MBV, which target the same retail customers ACB depends on for CASA. Given its CASA gap, ACB is more exposed to this pressure than TCB or MBB.<\/p><\/article><article class=\"subsection\"><h3>4.3 Macro shocks<\/h3><p>A severe macroeconomic shock could depress consumer demand and cause unexpected asset quality deterioration in ACB&#x27;s retail-heavy portfolio. High collateral coverage mitigates losses, but a sharp fall in property prices would erode collateral values and weaken this buffer.<\/p><\/article><article class=\"subsection\"><h3>4.4 Execution risk from the corporate pivot<\/h3><p>Growing MMLC lending by 42% in a single year moves ACB into a segment where it has limited experience and weaker competitive positioning against state-owned banks. Large-corporate loans also carry higher concentration risk. Rapid expansion here could dilute the asset quality moat that underpins ACB&#x27;s premium valuation.<\/p><\/article><article class=\"subsection\"><h3>4.5 Embedded finance in the SME segment<\/h3><p>More SMEs are moving onto e-commerce platforms, which can use verified data on revenue, inventory and cash flow to underwrite financing faster and more efficiently than banks. Offerings such as Shopee&#x27;s Monee show how platforms can capture small merchants&#x27; borrowing needs, potentially eroding ACB&#x27;s SME franchise.<\/p><\/article>"}, {"type": "swot", "name": "Summary", "html": "<p>ACB is the most defensive large private bank in Vietnam. Its secured retail and SME book, zero corporate bond exposure and minimal developer lending deliver top-tier returns with low volatility, and its balance sheet is built to outperform when liquidity tightens or the macro cycle turns. The trade-off is a structurally higher cost of funds, driven by a CASA ratio well below leading peers, and a thin ecosystem that limits cross-selling. Management is now addressing both gaps through subsidiary capitalisation, the ACB ONE digital platform and a push into large-corporate lending. That pivot is the key swing factor: it could close the CASA and ecosystem gaps, but it also moves ACB away from the conservative underwriting that underpins its premium profile.<\/p><h3>SWOT at a glance<\/h3><div class=\"swot-glance\"><div class=\"swot-glance-cell\" style=\"border-top-color:var(--green);background:#eaf3e8;\"><h4 style=\"color:var(--green);\">Strengths<\/h4><ul><li>Low-risk, well-capitalised franchise (average ROAE 22.9%, CAR 11.8%)<\/li><li>Strong anchor in secured retail and SME lending<\/li><li>Asset quality moat: NPL ~1%, LLCR &gt;100%, ~97% collateralised<\/li><li>Cost discipline (CIR ~32.3%)<\/li><li>ACBS emerging as a second earnings engine<\/li><\/ul><\/div><div class=\"swot-glance-cell\" style=\"border-top-color:var(--rose);background:#f7e9ec;\"><h4 style=\"color:var(--rose);\">Weaknesses<\/h4><ul><li>CASA ~22%, well below TCB/MBB (&gt;35%)<\/li><li>Conservative growth lags peers in upturns<\/li><li>Limited wholesale/corporate franchise<\/li><li>Narrow ecosystem with no corporate group backing<\/li><\/ul><\/div><div class=\"swot-glance-cell\" style=\"border-top-color:var(--blue);background:#e8eff8;\"><h4 style=\"color:var(--blue);\">Opportunities<\/h4><ul><li>Risk-appetite headroom for higher-yield lending to existing customers<\/li><li>Subsidiary capitalisation: ACBS, ACBA, new ACBI<\/li><li>ACB ONE to lower acquisition costs and lift CASA<\/li><li>Corporate expansion and longer-tenor lending<\/li><\/ul><\/div><div class=\"swot-glance-cell\" style=\"border-top-color:var(--amber);background:#fbf0e2;\"><h4 style=\"color:var(--amber);\">Threats<\/h4><ul><li>SBV credit quotas and lending-rate guidance<\/li><li>Deposit competition, incl. digital banks<\/li><li>Macro shocks hitting a retail-heavy book<\/li><li>Execution risk from the corporate pivot<\/li><li>Embedded finance eroding the SME base<\/li><\/ul><\/div><\/div>"}, {"type": "appendix", "name": "Tier Classification", "html": "<div class=\"appendix-tier-grid\"><section class=\"chart-panel appendix-tier-chart\"><h2>Tier 1<\/h2><p class=\"eyebrow\">Total Assets 2025<\/p><div class=\"appendix-bar-row\"><span class=\"appendix-bar-label\">BID<\/span><div class=\"appendix-bar-track\"><div class=\"appendix-bar-fill\" style=\"width:100.00%\"><\/div><\/div><span class=\"appendix-bar-value\">3,330,826<\/span><\/div><div class=\"appendix-bar-row\"><span class=\"appendix-bar-label\">CTG<\/span><div class=\"appendix-bar-track\"><div class=\"appendix-bar-fill\" style=\"width:83.09%\"><\/div><\/div><span class=\"appendix-bar-value\">2,767,699<\/span><\/div><div class=\"appendix-bar-row\"><span class=\"appendix-bar-label\">VCB<\/span><div class=\"appendix-bar-track\"><div class=\"appendix-bar-fill\" style=\"width:73.32%\"><\/div><\/div><span class=\"appendix-bar-value\">2,442,279<\/span><\/div><div class=\"appendix-bar-row\"><span class=\"appendix-bar-label\">MBB<\/span><div class=\"appendix-bar-track\"><div class=\"appendix-bar-fill\" style=\"width:48.51%\"><\/div><\/div><span class=\"appendix-bar-value\">1,615,764<\/span><\/div><div class=\"appendix-bar-row\"><span class=\"appendix-bar-label\">VPB<\/span><div class=\"appendix-bar-track\"><div class=\"appendix-bar-fill\" style=\"width:37.83%\"><\/div><\/div><span class=\"a 27;s confidentiality and securities-trading policies.<\/p><\/article><article class=\"disclaimer-card\"><h2>Forward-looking information<\/h2><p>Plans, targets and proposals, including 2026 segment growth, subsidiary capital plans and the FP&amp;A roadmap, reflect current assumptions and are subject to risks and uncertainties; actual outcomes may differ materially.<\/p><\/article><article class=\"disclaimer-card\"><h2>Accuracy and completeness<\/h2><p>Although prepared with care, the information has not been independently verified and may be incomplete or out of date. It should be read together with ACB&#x27;s official financial statements and management reports, which prevail in case of difference.<\/p><\/article><\/section><section class=\"disclaimer-source\"><p><strong>Sources:<\/strong> ACB Bank Dashboard (ACB Data.xlsx) and the Sources appendix, including ACB publications, broker research, ratings, market data and news.<\/p><\/section>"}], "swotStartIndex": 8, "swotEndIndex": 14, "appendixStartIndex": 14, "appendixEndIndex": 17, "disclaimerStartIndex": 17, "disclaimerEndIndex": 18, "nextChapterStartIndex": null, "nextChapterEndIndex": null};

    const periodColorByLabel = {
      "2016": periodPalette[0],
      "2017": periodPalette[1],
      "2018": periodPalette[2],
      "2019": periodPalette[3],
      "2020": periodPalette[4],
      "2021": periodPalette[5],

      "2023": periodPalette[7],
      "2024": periodPalette[8],
      "2025": periodPalette[9],
